[project]
name = "neural_manifold_analysis"
version = "0.1.0"
description = "Neural population geometry & manifold-analysis primitives (normalization, PCA, dimensionality, pairwise metrics, Procrustes, sampling, IO, plotting)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Marten Samulowitz"}]
keywords = ["neuroscience", "dimensionality", "PCA", "manifold", "procrustes", "neural-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/MartenSamulowitz/neural_manifold_analysis"
Repository = "https://github.com/MartenSamulowitz/neural_manifold_analysis"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_manifold_analysis"]
